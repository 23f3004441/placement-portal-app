<!DOCTYPE html>
<html>
<head>
    <title>Placement History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5"> 

    <h1 class="text-center mb-4">Placement History</h1>
    {% if placements %}
    <table class="table table-bordered table-striped table-hover">
        <tr>
            <th>Company</th>
            <th>Role</th>
        </tr>
        
        {% for application in placements %}
        <tr>
            <td>{{ application.placement_drive.company.company_name }}</td>
            <td>{{ application.placement_drive.job_position.job_title }}</td>
        </tr>
        {% endfor %}
    </table>

    {% else %}
    <div class="alert alert-info">
    You have not been placed yet.
    </div>
    {% endif %}
    
    <a class="btn btn-secondary" href="{{ url_for('student_dashboard') }}">Back to Dashboard</a>

    </div>
</body>
</html>
