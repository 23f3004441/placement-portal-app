<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5"> 

    {% if message %}
        <div class="alert alert-danger">{{ message }}</div>
    {% endif %}

    <h1 class="text-center mb-4">Student Registration</h1>

    <form method="POST" enctype="multipart/form-data"> 
        <!--enctype=multipart/form-data splits the request body 
        into parts. (for fields, files etc.) only encoding that 
        supports fileuploads -->

        <div class="mb-3">
        <label class="form-label">Name</label>
        <input class="form-control" type="text" name="name" required maxlength="100">
        </div>

        <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" required>
        </div>

        <div class="mb-3">
        <label class="form-label">Password</label>
        <input  class="form-control" type="password" name="password" required minlength="6">
        </div>

        <div class="mb-3">
        <label class="form-label">Phone</label>
        <input class="form-control" type="text" name="phone" maxlength="10">
        </div>

        <div class="mb-3">
        <label class="form-label">Education</label>
        <input class="form-control" type="text" name="education" maxlength="500">
        </div>

        <div class="mb-3">
        <label class="form-label">Skills</label>
        <input class="form-control" type="text" name="skills" maxlength="200">
        </div>

        <div class="mb-3">
        <label class="form-label">Resume</label>
        <input class="form-control" type="file" name="resume" accept=".pdf,.doc,.docx">
        </div>

        <button class="btn btn-primary" type="submit">Register</button>
    </form>

    </div>

</body>
</html>
