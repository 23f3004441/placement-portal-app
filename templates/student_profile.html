<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5"> 

    <h1 class="text-center mb-4">Edit Profile</h1>
    <form method="POST" enctype="multipart/form-data">
        
        <div class="mb-3">
        <label class="form-label">Name:</label>
        <input class="form-control" type="text" name="student_name" value="{{ student.student_name }}" required>
        </div>

        <div class="mb-3">
        <label class="form-label">Phone:</label>
        <input class="form-control" type="text" name="student_phone" value="{{ student.student_phone or '' }}">
        </div>

        <div class="mb-3">
        <label class="form-label">Education:</label>
        <input class="form-control" type="text" name="student_education" value="{{ student.student_education or '' }}">
        </div>

        <div class="mb-3">
        <label class="form-label">Skills:</label>
        <input class="form-control" type="text" name="student_skills" value="{{ student.student_skills or '' }}">
        </div>

        <div class="mb-3">
        <label class="form-label">Update Resume:</label>
        <input class="form-control" type="file" name="resume">
        </div>
        
        <button class="btn btn-primary" type="submit">Save Changes</button>

    </form>

    <div class="mt-3">
    <a class="btn btn-secondary" href="{{ url_for('student_dashboard' )}}">Back to Dashboard</a>
    </div>
    
    </div>
</body>
</html>
