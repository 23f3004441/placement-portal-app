<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Placement Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5"> 
    
    {% if message %}
        <div class="alert alert-danger">{{ message }}</div>
    {% endif %}

    <h1 class="text-center mb-4">Login</h1>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
        <label class="form-label" for="email">Email / Username</label>
        <input class="form-control" type="text" id="email" name="email" required>
        </div>

        <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required>
        </div>

        <button class="btn btn-primary" type="submit">Login</button>
    </form>

    <div class="mt-3">
        Don’t have an account?
        <a class="btn btn-primary btn-sm" href="/register_student">Register as Student</a> 
        <a class="btn btn-primary btn-sm" href="/register_company">Register as Company</a>
    </div>

    <div class="mt-3">
        <a class="btn btn-secondary" href="/">Back to Home</a>
    </div>

    </div>
</body>
</html>
