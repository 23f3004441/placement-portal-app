<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5"> 

    {% if message %}
        <div class="alert alert-danger">{{ message }}</div>
    {% endif %}

    <h1 class="text-center mb-4">Company Registration</h1>

    <form method="POST">

        <div class="mb-3">
        <label class="form-label">Company Name</label>
        <input class="form-control" type="text" name="name" required maxlength="100">
        </div>

        <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email" required>
        </div>

        <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required minlength="6">
        </div>

        <div class="mb-3">
        <label class="form-label">Industry</label>
        <input class="form-control" type="text" name="industry" maxlength="100">
        </div>

        <div class="mb-3">
        <label class="form-label">Contact</label>
        <input class="form-control" type="text" name="contact" maxlength="20">
        </div>

        <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" maxlength="500"></textarea>
        </div>

        <button class="btn btn-primary" type="submit">Register</button>
    </form>

    </div>
</body>
</html>
