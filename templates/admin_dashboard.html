<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">

    <h1 class="text-center mb-3">Welcome, Admin</h1>
    <h2 class="text-center mb-4">System Overview</h2>

        <div class="row g-4">

            <div class="col-md-6">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h3>Total Students</h3>
                        <p style="color: black; font-size: 30px;">{{ total_students }}</p>
                        <a class="btn btn-primary" href="{{ url_for('admin_students') }}">View List</a>               
                    </div>
                </div>
            </div>
        

            <div class="col-md-6">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h3>Total Companies</h3>
                        <p style="color: black; font-size: 30px;">{{ total_companies }}</p>
                        <a class="btn btn-primary" href="{{ url_for('admin_companies') }}">View List</a>               
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h3>Total Drives</h3>
                        <p style="color: black; font-size: 30px;">{{ total_drives }}</p>
                        <a class="btn btn-primary" href="{{ url_for('admin_drives') }}">View List</a>               
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h3>Total Applications</h3>
                        <p style="color: black; font-size: 30px;">{{ total_applications }}</p>
                        <a class="btn btn-primary" href="{{ url_for('admin_applications') }}">View List</a>               
                    </div>
                </div>
            </div>

        </div>
    
    <br><br>
    <a class="btn btn-secondary" href="{{ url_for('logout') }}">LOGOUT</a>
    
    </div>
    </body>
</html>
