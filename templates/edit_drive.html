<!DOCTYPE html>
<html>
<head>
    <title>Edit Placement Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5"> 

    <h1 class="text-center mb-4">Edit Drive</h1>

    <form method="POST">
        <h2 class="mt-4 mb-3">Job Details:</h2>

        <div class="mb-3">
        <label class="form-label">Job Title:</label>
        <input type="text" name="job_title" value="{{ drive.job_position.job_title }}" required>
        </div>

        <div class="mb-3">
        <label class="form-label">Required Skills:</label>
        <input type="text" name="required_skills" value="{{ drive.job_position.required_skills or '' }}">
        </div>

        <div class="mb-3">
        <label class="form-label">Experience Required:</label>
        <input type="text" name="experience_required" value="{{ drive.job_position.experience_required or '' }}">
        </div>

        <div class="mb-3">
        <label class="form-label">Minimum Salary:</label>
        <input type="number" step="0.01" name="salary_min" value="{{ drive.job_position.salary_min or '' }}">
        </div>

        <div class="mb-3">
        <label class="form-label">Maximum Salary:</label>
        <input type="number" step="0.01" name="salary_max" value="{{ drive.job_position.salary_max or '' }}">
        </div>

        <div class="mb-3">
        <label class="form-label">Job Description:</label>
        <textarea rows="10" cols="40" name="job_description">{{ drive.job_position.job_description or '' }}"></textarea>
        </div>

        <h2 class="mt-4 mb-3">Drive Details:</h2>
        
        <div class="mb-3">
        <label class="form-label">Application Deadline:</label>
        <input type="datetime-local" name="application_deadline" value="{% if drive.application_deadline %}{{ drive.application_deadline.strftime('%Y-%m-%dT%H:%M') }}{% endif %}">
        </div>

        <div class="mb-3">
        <label class="form-label">Eligibility Criteria:</label>
        <textarea name="eligibility_criteria" rows="10" cols="40">{{ drive.eligibility_criteria or '' }}</textarea>
        </div>

        <button class="btn btn-primary" type="submit">Save Changes</button>
    </form>

    <div class="mt-3">
    <a class="btn btn-secondary btn-sm" href="{{ url_for('company_dashboard') }}">Back to dashboard</a>
    </div>

    </div>
</body>
</html>
